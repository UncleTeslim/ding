services:
  ding:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ding-data:/app/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  ding-data:
