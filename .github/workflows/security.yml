name: Security
on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  supported-image:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Find currently supported stable image
        id: stable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$(gh api 'repos/${{ github.repository }}/releases' --jq '[.[] | select(.draft == false and .prerelease == false)][0].tag_name // empty')"
          if [ -z "$TAG" ]; then
            echo 'No stable release exists yet; candidate images are scanned by the release workflow.' >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "image=ghcr.io/uncleteslim/ding:${TAG#v}" >> "$GITHUB_OUTPUT"
          else
            echo 'Unexpected stable release tag' >&2
            exit 1
          fi
      - name: Scan supported published image for newly disclosed vulnerabilities
        if: steps.stable.outputs.image != ''
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec
        with:
          image-ref: ${{ steps.stable.outputs.image }}
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Audit complete lockfile
        run: npm audit --package-lock-only --audit-level=high
      - name: Audit production lockfile
        if: always()
        run: npm audit --package-lock-only --omit=dev --audit-level=high
      - name: Scan source dependencies and secrets
        if: always()
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec
        with:
          scan-type: fs
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: '1'
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@b7b84b636b4f90c9b31da1bc5f72bfadd5b31410 # v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@b7b84b636b4f90c9b31da1bc5f72bfadd5b31410 # v3
