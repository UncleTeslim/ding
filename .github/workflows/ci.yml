name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm test
      - run: npm run coverage
      - run: npm run check:size

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create production test environment
        shell: bash
        run: |
          cat > .env <<'EOF'
          DING_ADMIN_USERNAME=admin
          DING_ADMIN_PASSWORD_HASH=$2a$04$7u6wK1k7Q9VwM8a9L4XwUeN4m9nT9o3xY1tL2mQ8oK6rP2eV4sY5u
          DING_JWT_SECRET=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          DING_IP_SALT=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          DING_BASE_URL=https://ding.example.com
          DING_DB_PATH=/app/data/ding.db
          DING_TRUST_PROXY=false
          PORT=3000
          NODE_ENV=production
          EOF
      - name: Build and start Ding
        run: docker compose up --build -d --wait
      - name: Check health
        run: curl --fail http://127.0.0.1:3000/health
      - name: Verify data survives restart
        run: |
          docker compose restart ding
          sleep 3
          curl --fail http://127.0.0.1:3000/health
      - name: Clean up
        if: always()
        run: docker compose down -v
