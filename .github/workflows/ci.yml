name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: Restore Rollup Linux native package
        shell: bash
        run: |
          ROLLUP_VERSION="$(node -p 'require("./node_modules/rollup/package.json").version')"
          ROLLUP_PACKAGE="@rollup/rollup-linux-x64-gnu"
          ROLLUP_ARCHIVE="$(npm pack "${ROLLUP_PACKAGE}@${ROLLUP_VERSION}" --silent)"
          mkdir -p "node_modules/${ROLLUP_PACKAGE}"
          tar -xzf "$ROLLUP_ARCHIVE" --strip-components=1 -C "node_modules/${ROLLUP_PACKAGE}"
          rm "$ROLLUP_ARCHIVE"
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run coverage
      - run: npm run check:size

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Create production test environment
        shell: bash
        run: |
          cat > .env <<'EOF'
          DING_ADMIN_USERNAME=admin
          DING_ADMIN_PASSWORD_HASH=$2a$04$7u6wK1k7Q9VwM8a9L4XwUeN4m9nT9o3xY1tL2mQ8oK6rP2eV4sY5u
          DING_JWT_SECRET=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          DING_IP_SALT=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          DING_BASE_URL=https://ding.example.com
          DING_DB_PATH=/app/data/ding.db
          DING_TRUST_PROXY=false
          PORT=3000
          NODE_ENV=production
          EOF
      - name: Build and start Ding
        run: docker compose up --build -d --wait
      - name: Check health
        run: curl --fail http://127.0.0.1:3000/health
      - name: Verify data survives restart
        run: |
          node scripts/check-persistence.mjs seed
          docker compose restart ding
          node scripts/check-persistence.mjs verify
      - name: Scan the built production image
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec
        with:
          image-ref: ding:local
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'
      - name: Clean up
        if: always()
        run: docker compose down -v
