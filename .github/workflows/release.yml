name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write
      actions: read
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: [verify, security]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "Expected vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-rc.N; got $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/uncleteslim/ding
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.source=https://github.com/UncleTeslim/ding
            org.opencontainers.image.description=Self-hosted in-app changelog and announcement widget

      - name: Build candidate without publishing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Scan the exact candidate image
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec
        with:
          image-ref: ${{ steps.meta.outputs.tags }}
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: '1'

      - name: Generate candidate SBOM
        uses: aquasecurity/trivy-action@38b337fff0a2f984d5be173c99e3f633438167ec
        with:
          image-ref: ${{ steps.meta.outputs.tags }}
          format: cyclonedx
          output: ding.cdx.json

      - name: Push verified image
        id: published
        env:
          IMAGE: ${{ steps.meta.outputs.tags }}
        run: |
          docker push "$IMAGE"
          DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE")"
          echo "digest=${DIGEST#*@}" >> "$GITHUB_OUTPUT"

      - name: Attest image provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ghcr.io/uncleteslim/ding
          subject-digest: ${{ steps.published.outputs.digest }}
          push-to-registry: true

      - name: Attest image SBOM
        uses: actions/attest-sbom@51e74621a501c89df81fc1391c5a8f4cfc9fab2f # v3
        with:
          subject-name: ghcr.io/uncleteslim/ding
          subject-digest: ${{ steps.published.outputs.digest }}
          sbom-path: ding.cdx.json
          push-to-registry: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" =~ -rc\.[0-9]+$ ]]; then
            gh release create "$GITHUB_REF_NAME" ding.cdx.json --prerelease --generate-notes
          else
            gh release create "$GITHUB_REF_NAME" ding.cdx.json --generate-notes
          fi
